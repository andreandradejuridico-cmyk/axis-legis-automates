name: Deploy to Hostinger

on:
  push:
    branches:
      - main # OU branch principal do seu projeto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build # Gera a pasta dist/

      - name: 📂 Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Geralmente a pasta de build do Vite
          server-dir: public_html/ # Pasta destino na Hostinger
          dangerous-clean-slate: true # Apaga arquivos antigos para evitar conflitos
